<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A simple local budget planner"><title>Budget Planner</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><p class="eyebrow">PERSONAL FINANCE · LOCAL DEMO</p><h1>Budget Planner</h1><p>Track this month's spending. Data is saved only in this browser.</p></header>
<section class="summary" aria-label="Monthly budget summary"><div><span>Monthly limit</span><strong id="limit-label">€500.00</strong></div><div><span>Spent</span><strong id="spent-label">€0.00</strong></div><div><span>Remaining</span><strong id="remaining-label">€500.00</strong></div></section><progress id="progress" max="500" value="0" aria-label="Budget used"></progress><p id="budget-message" role="status" aria-live="polite"></p>
<form id="budget-form" class="budget-form"><label for="limit">Monthly limit (€)</label><div class="row"><input id="limit" type="number" min="0.01" step="0.01" required value="500"><button>Save limit</button></div></form>
<form id="expense-form"><h2>Add an expense</h2><div class="fields"><label>Description<input name="description" maxlength="80" required></label><label>Category<select name="category"><option>Food</option><option>Transport</option><option>Housing</option><option>Health</option><option>Other</option></select></label><label>Amount (€)<input name="amount" type="number" min="0.01" step="0.01" required></label><button>Add expense</button></div></form>
<section><div class="list-head"><h2>Expenses</h2><label>Filter<select id="filter"><option value="all">All</option><option>Food</option><option>Transport</option><option>Housing</option><option>Health</option><option>Other</option></select></label></div><ul id="expenses"></ul><button id="clear" class="quiet" type="button">Delete all expenses</button></section></main><script src="app.js"></script></body></html>
